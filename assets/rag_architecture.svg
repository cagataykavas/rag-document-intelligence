<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#132b43"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#6ee7ff"/><stop offset="1" stop-color="#8b8cff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1280" height="610" rx="30" fill="url(#bg)"/>
  <text x="54" y="62" fill="#fff" font-family="Arial" font-size="30" font-weight="700">RAG Document Intelligence</text>
  <text x="54" y="94" fill="#9eb3ca" font-family="Arial" font-size="16">Persistent ingestion · evidence retrieval · zero / one / few-shot prompting · cited answers · conflict analysis</text>

  <g font-family="Arial" filter="url(#shadow)">
    <rect x="55" y="155" width="170" height="105" rx="16" fill="#102238" stroke="#35536e"/>
    <text x="82" y="194" fill="#fff" font-size="19" font-weight="700">Documents</text>
    <text x="82" y="225" fill="#9eb3ca" font-size="14">PDF · MD · TXT</text><text x="82" y="247" fill="#9eb3ca" font-size="14">JSON · CSV</text>

    <rect x="285" y="155" width="190" height="105" rx="16" fill="#102238" stroke="#35536e"/>
    <text x="312" y="194" fill="#fff" font-size="19" font-weight="700">Ingestion</text>
    <text x="312" y="225" fill="#9eb3ca" font-size="14">parse · normalize</text><text x="312" y="247" fill="#9eb3ca" font-size="14">chunk · SHA dedup</text>

    <rect x="535" y="155" width="190" height="105" rx="16" fill="#102238" stroke="#35536e"/>
    <text x="562" y="194" fill="#fff" font-size="19" font-weight="700">SQLite Store</text>
    <text x="562" y="225" fill="#9eb3ca" font-size="14">documents + chunks</text><text x="562" y="247" fill="#9eb3ca" font-size="14">source provenance</text>

    <rect x="785" y="155" width="190" height="105" rx="16" fill="#102238" stroke="#35536e"/>
    <text x="812" y="194" fill="#fff" font-size="19" font-weight="700">Retrieval</text>
    <text x="812" y="225" fill="#9eb3ca" font-size="14">TF-IDF baseline</text><text x="812" y="247" fill="#9eb3ca" font-size="14">top-k evidence</text>

    <rect x="1035" y="155" width="190" height="105" rx="16" fill="#102238" stroke="#35536e"/>
    <text x="1062" y="194" fill="#fff" font-size="19" font-weight="700">Answer</text>
    <text x="1062" y="225" fill="#9eb3ca" font-size="14">extractive / LLM</text><text x="1062" y="247" fill="#9eb3ca" font-size="14">citation whitelist</text>
  </g>

  <g stroke="url(#accent)" stroke-width="4" fill="none"><path d="M225 208 H285"/><path d="M475 208 H535"/><path d="M725 208 H785"/><path d="M975 208 H1035"/></g>
  <g fill="#6ee7ff"><polygon points="278,201 290,208 278,215"/><polygon points="528,201 540,208 528,215"/><polygon points="778,201 790,208 778,215"/><polygon points="1028,201 1040,208 1028,215"/></g>

  <rect x="290" y="350" width="280" height="165" rx="18" fill="#0d1d31" stroke="#3d5872"/>
  <text x="320" y="392" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Prompt modes</text>
  <text x="320" y="427" fill="#6ee7ff" font-family="Arial" font-size="16">ZERO-SHOT</text><text x="445" y="427" fill="#9eb3ca" font-family="Arial" font-size="14">instructions only</text>
  <text x="320" y="459" fill="#6ee7ff" font-family="Arial" font-size="16">ONE-SHOT</text><text x="445" y="459" fill="#9eb3ca" font-family="Arial" font-size="14">1 structured example</text>
  <text x="320" y="491" fill="#6ee7ff" font-family="Arial" font-size="16">FEW-SHOT</text><text x="445" y="491" fill="#9eb3ca" font-family="Arial" font-size="14">2+ examples</text>

  <rect x="620" y="350" width="330" height="165" rx="18" fill="#0d1d31" stroke="#3d5872"/>
  <text x="650" y="392" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Requirement intelligence</text>
  <text x="650" y="428" fill="#9eb3ca" font-family="Arial" font-size="15">numeric mismatch · negation polarity</text>
  <text x="650" y="459" fill="#9eb3ca" font-family="Arial" font-size="15">normative modality · evidence pair</text>
  <text x="650" y="490" fill="#51d88a" font-family="Arial" font-size="15">deterministic + testable before LLM</text>

  <path d="M880 260 C880 310 785 310 785 350" stroke="#8b8cff" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
  <path d="M1130 260 C1130 325 540 320 540 350" stroke="#6ee7ff" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
  <text x="55" y="566" fill="#7f93aa" font-family="Arial" font-size="14">Every generated citation is filtered against retrieved chunk IDs before it is returned to the caller.</text>
</svg>
