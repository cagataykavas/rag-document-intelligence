name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RAG_DB_PATH: data/ci-rag.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check src app tests
      - run: pytest -q
      - name: Gate canonical retrieval snapshot
        run: |
          python -m src.cli \
            --database "${RUNNER_TEMP}/retrieval-gate.db" \
            ingest tests/fixtures/retrieval_gate/corpus \
            --words-per-chunk 4 \
            --overlap 0 >/dev/null
          python -m src.retrieval_gate \
            --database "${RUNNER_TEMP}/retrieval-gate.db" \
            --cases tests/fixtures/retrieval_gate/cases.json \
            --baseline tests/fixtures/retrieval_gate/baseline.json
      - run: docker compose config
      - run: docker build -t rag-document-intelligence:test .
