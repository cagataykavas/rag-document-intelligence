name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RAG_DB_PATH: data/ci-rag.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check src app tests tools
      - run: python tools/restore_evidence.py
      - run: pytest -q
      - run: docker compose config
      - run: docker build -t rag-document-intelligence:test .

  optional-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-mcp.txt -r requirements-observability.txt
      - run: python tools/restore_evidence.py
      - run: pytest -q tests/test_evidence_mcp.py tests/test_integrated_agent.py tests/test_persistent_mcp.py
