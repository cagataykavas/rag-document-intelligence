services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_DB_PATH: /data/rag.db
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local}
      LLM_MODEL: ${LLM_MODEL:-local-model}
    volumes:
      - rag_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rag_data:
